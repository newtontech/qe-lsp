[project]
name = "qe-lsp"
version = "0.1.0"
description = "Language Server Protocol for qe"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "pygls>=1.2.0",
    "lsprotocol>=2023.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pre-commit",
    "black",
    "ruff",
    "mypy<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
qe-lsp = "qe_lsp.server:main"

[tool.black]
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=qe_lsp --cov-report=term-missing --cov-fail-under=80"

[tool.mypy]
python_version = "3.9"
warn_unused_configs = true
warn_return_any = true
